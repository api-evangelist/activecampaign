anomalies:
- kind: success-status-carrying-failure
  operationId: delete-a-campaign
  status: 200
  detail: 'ActiveCampaign documents this explicitly: "This endpoint reports failures in the response body
    rather than with an error status: a campaign that does not exist, or a user without permission to
    delete campaigns, both return 200 with succeeded set to 0." Any agent that branches on HTTP status
    alone will report a phantom success.'
  source: https://developers.activecampaign.com/reference/delete-a-campaign
- kind: no-401-on-most-of-v3
  detail: 401 appears 54 times and almost entirely inside the Partners API and the SMS/WhatsApp specs.
    The main v3 document largely declares 403 for authentication failure instead — ActiveCampaign's own
    account endpoint documentation says a missing or invalid Api-Token returns 403, not 401. Agents should
    treat 403 as "check the token" on this API.
  source: https://developers.activecampaign.com/reference/retrieve-account-information
