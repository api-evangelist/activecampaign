openapi: 3.2.0
info:
  title: Activecampaign Templates API
  x-refined-note:
  - x-generated-from differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Templates across 2 of this provider''s published API definitions: activecampaign-v3.json, activecampaign-whatsapp-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{yourAccountName}.api-us1.com/api/3
  description: ActiveCampaign API server (account-specific)
  variables:
    yourAccountName:
      default: yourAccountName
      description: Your ActiveCampaign account name
- url: https://{youraccountname}.api-us1.com/api/3
  description: Production Server
tags:
- name: Templates
paths:
  /templates/{id}:
    get:
      summary: ActiveCampaign Retrieve a Template
      description: ''
      operationId: retrieve-a-template
      parameters:
      - name: id
        in: path
        description: ID of the template to retrieve
        schema:
          type: integer
          format: int32
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"template\": {\n        \"userid\": \"1\",\n        \"ed_instanceid\": \"0\",\n        \"ed_version\": \"0\",\n        \"name\": \"Test 2\",\n        \"subject\": null,\n        \"content\": \"sdsf\",\n        \"categoryid\": \"1\",\n        \"used\": \"1\",\n        \"waitpreview\": \"1\",\n        \"importnum\": \"0\",\n        \"mdate\": \"2018-08-28 11:54:54\",\n        \"preview_content\": null,\n        \"modified\": \"1\",\n        \"hidden\": \"0\",\n        \"links\": [],\n        \"id\": \"2\"\n    }\n}"
              schema:
                type: object
                properties:
                  template:
                    type: object
                    properties:
                      userid:
                        type: string
                        example: '1'
                      ed_instanceid:
                        type: string
                        example: '0'
                      ed_version:
                        type: string
                        example: '0'
                      name:
                        type: string
                        example: Test 2
                      subject: {}
                      content:
                        type: string
                        example: sdsf
                      categoryid:
                        type: string
                        example: '1'
                      used:
                        type: string
                        example: '1'
                      waitpreview:
                        type: string
                        example: '1'
                      importnum:
                        type: string
                        example: '0'
                      mdate:
                        type: string
                        example: '2018-08-28 11:54:54'
                      preview_content: {}
                      modified:
                        type: string
                        example: '1'
                      hidden:
                        type: string
                        example: '0'
                      links:
                        type: array
                      id:
                        type: string
                        example: '2'
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"message\": \"No Result found for Template with id 10\"\n}"
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: No Result found for Template with id 10
      deprecated: false
      tags:
      - Templates
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - ApiToken: []
    servers:
    - url: https://{yourAccountName}.api-us1.com/api/3
      description: ActiveCampaign API server (account-specific)
      variables:
        yourAccountName:
          default: yourAccountName
          description: Your ActiveCampaign account name
  /channel/whatsapp/channels/whatsapp/template:
    get:
      operationId: List WhatsApp Templates
      description: Lists WhatsApp Templates. You can search with the `name` and `status` fields using the `?seach=my-template-name` query parameter.
      summary: List WhatsApp Templates
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - ACCOUNT_UPDATE
          - ALERT_UPDATE
          - APPOINTMENT_UPDATE
          - AUTHENTICATION
          - AUTO_REPLY
          - ISSUE_RESOLUTION
          - MARKETING
          - OTP
          - PAYMENT_UPDATE
          - PERSONAL_FINANCE_UPDATE
          - RESERVATION_UPDATE
          - SHIPPING_UPDATE
          - TICKET_UPDATE
          - TRANSACTIONAL
          - TRANSPORTATION_UPDATE
          - UTILITY
        description: '* `ACCOUNT_UPDATE` - Account Update

          * `PAYMENT_UPDATE` - Payment Update

          * `PERSONAL_FINANCE_UPDATE` - Personal Finance Update

          * `SHIPPING_UPDATE` - Shipping Update

          * `RESERVATION_UPDATE` - Reservation Update

          * `ISSUE_RESOLUTION` - Issue Resolution

          * `APPOINTMENT_UPDATE` - Appointment Update

          * `TRANSPORTATION_UPDATE` - Transportation Update

          * `TICKET_UPDATE` - Ticket Update

          * `ALERT_UPDATE` - Alert Update

          * `AUTO_REPLY` - Auto Reply

          * `TRANSACTIONAL` - Transactional

          * `MARKETING` - Marketing

          * `OTP` - Otp

          * `AUTHENTICATION` - Authentication

          * `UTILITY` - Utility'
      - in: query
        name: category__in
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: channel
        schema:
          type: integer
      - in: query
        name: channel__in
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - approved
          - deleted
          - disabled
          - draft
          - in_appeal
          - pending
          - pending_deletion
          - rejected
          - submitted
        description: '* `draft` - Draft

          * `approved` - Approved

          * `in_appeal` - In Appeal

          * `pending` - Pending

          * `rejected` - Rejected

          * `pending_deletion` - Pending Deletion

          * `deleted` - Deleted

          * `disabled` - Disabled

          * `submitted` - Submitted'
      - in: query
        name: status__in
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      tags:
      - Templates
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWhatsAppTemplateSimpleReadList'
          description: ''
    servers:
    - url: https://{youraccountname}.api-us1.com/api/3
      description: Production Server
  /channel/whatsapp/channels/whatsapp/template/{id}:
    get:
      operationId: Get WhatsApp Template
      description: Gets a WhatsApp Template by Id.
      summary: Get WhatsApp Template
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Templates
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppTemplateRead'
          description: ''
    put:
      operationId: channels_whatsapp_template_update
      description: Update a WhatsApp Template by Id.
      summary: Update WhatsApp Template
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Templates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppTemplateRead'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WhatsAppTemplateRead'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WhatsAppTemplateRead'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppTemplateRead'
          description: ''
    delete:
      operationId: Delete WhatsApp Template
      description: Deletes a WhatsApp Template by Id.
      summary: Delete WhatsApp Template
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Templates
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
    servers:
    - url: https://{youraccountname}.api-us1.com/api/3
      description: Production Server
  /channel/whatsapp/channels/whatsapp/template/{id}/send:
    post:
      operationId: Send a WhatsApp Template Message
      description: 'Send a single WhatsApp message: select a template to use and call our endpoint with the recipient phone number and the variables the template needs. That''s it!'
      summary: Send a WhatsApp Template
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Template Id
        required: true
        examples:
          TheTemplateIdThatWeWantToSend:
            value: a3ff7ee5-0c11-49e2-a0d6-7e316626f7b1
            summary: The Template Id that we want to send
      tags:
      - Templates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppTemplateSend'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WhatsAppTemplateSend'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WhatsAppTemplateSend'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppTemplateSendPublicResponse'
              examples:
                WhatsAppTemplateSendPublicResponse:
                  value:
                    id: a513da3a-8b73-42aa-a938-0eb1e0141533
                    conversation: ee49ab6c-dfd8-4cb6-a512-5880f4385622
                  description: Returns the Message Id and its Conversation Id.
          description: ''
    servers:
    - url: https://{youraccountname}.api-us1.com/api/3
      description: Production Server
