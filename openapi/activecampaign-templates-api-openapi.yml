openapi: 3.0.3
info:
  title: ActiveCampaign SMS Broadcast Accounts Templates API
  description: API for managing SMS broadcasts, lists, metrics, and AI-powered content generation in ActiveCampaign
  version: 3.0.0
  contact:
    name: ActiveCampaign Support
    url: https://www.activecampaign.com
  x-generated-from: documentation
servers:
- url: https://{yourAccountName}.api-us1.com/api/3
  description: US-based Users
  variables:
    yourAccountName:
      default: yourAccountName
security:
- ApiToken: []
tags:
- name: Templates
paths:
  /templates/{id}:
    get:
      summary: ActiveCampaign Retrieve a Template
      description: ''
      operationId: retrieve-a-template
      parameters:
      - name: id
        in: path
        description: ID of the template to retrieve
        schema:
          type: integer
          format: int32
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"template\": {\n        \"userid\": \"1\",\n        \"ed_instanceid\": \"0\",\n        \"ed_version\": \"0\",\n        \"name\": \"Test 2\",\n        \"subject\": null,\n        \"content\": \"sdsf\",\n        \"categoryid\": \"1\",\n        \"used\": \"1\",\n        \"waitpreview\": \"1\",\n        \"importnum\": \"0\",\n        \"mdate\": \"2018-08-28 11:54:54\",\n        \"preview_content\": null,\n        \"modified\": \"1\",\n        \"hidden\": \"0\",\n        \"links\": [],\n        \"id\": \"2\"\n    }\n}"
              schema:
                type: object
                properties:
                  template:
                    type: object
                    properties:
                      userid:
                        type: string
                        example: '1'
                      ed_instanceid:
                        type: string
                        example: '0'
                      ed_version:
                        type: string
                        example: '0'
                      name:
                        type: string
                        example: Test 2
                      subject: {}
                      content:
                        type: string
                        example: sdsf
                      categoryid:
                        type: string
                        example: '1'
                      used:
                        type: string
                        example: '1'
                      waitpreview:
                        type: string
                        example: '1'
                      importnum:
                        type: string
                        example: '0'
                      mdate:
                        type: string
                        example: '2018-08-28 11:54:54'
                      preview_content: {}
                      modified:
                        type: string
                        example: '1'
                      hidden:
                        type: string
                        example: '0'
                      links:
                        type: array
                      id:
                        type: string
                        example: '2'
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"message\": \"No Result found for Template with id 10\"\n}"
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: No Result found for Template with id 10
      deprecated: false
      tags:
      - Templates
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      name: Api-Token
      in: header
      description: Your ActiveCampaign API token
