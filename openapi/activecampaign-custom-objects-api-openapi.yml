  /customObjects/schemas/{schemaId}:
    put:
      summary: ActiveCampaign Update a Schema
      description: 'Make an update to a given schema.


        To delete a schema field, reference the field delete endpoint: https://developers.activecampaign.com/reference/delete-a-field-1


        Users are encouraged to leverage the `?showFields=all` query parameter when programmatically creating new schema fields, to ensure field id uniqueness. Fields that have been deleted will contain a `status: marked_for_deletion` attribute.'
      operationId: update-a-schema
      parameters:
      - name: schemaId
        in: path
        description: Id of Schema being updated
        schema:
          type: string
        required: true
      - name: validateOnly
        in: header
        description: When set to `true` the API will validate the schema update without saving changes
        schema:
          type: boolean
          default: false
      - name: showFields
        in: query
        description: Toggle which fields are shown in the response body of a schema (if there hidden due to e.g. recently being deleted). Omit this parameter entirely to hide fields by default.
        schema:
          type: string
          default: all
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                schema:
                  properties:
                    slug:
                      type: string
                    labels:
                      properties:
                        singular:
                          type: string
                          description: Singular label for Schema
                        plural:
                          type: string
                          description: Plural label for Schema
                      required: []
                      type: object
                    description:
                      type: string
                      description: Text description of the Schema
                    appId:
                      type: string
                    fields:
                      type: array
                      items:
                        properties:
                          id:
                            type: string
                            description: id of the field
                          value:
                            type: string
                            description: Data type, appropriate for the field
                        type: object
                    icons:
                      properties:
                        default:
                          type: string
                          description: URI location of the default icon shown on Schema
                      required: []
                      type: object
                    relationships:
                      type: object
                      properties:
                        id:
                          type: string
                        labels:
                          type: object
                          properties:
                            singular:
                              type: string
                              description: human-readable singular name
                            plural:
                              type: string
                              description: human-readable plural name
                        description:
                          type: string
                        namespace:
                          type: string
                        hasMany:
                          type: boolean
                  required: []
                  type: object
            examples:
              Request Example:
                value:
                  schema:
                    slug: stripe-order
                    labels:
                      singular: Stripe Order
                      plural: Stripe Orders
                    description: Orders placed through the Stripe integration
                    appId: '123456'
                    fields:
                    - id: name
                      labels:
                        singular: Product Name
                        plural: Product Name
                      description: Name of the product from the Stripe integration
                      isRequired: true
                      origin: stripe
                      type: text
                    - id: total
                      labels:
                        singular: Order Total
                        plural: Order Totals
                      description: Total cost of the order
                      isRequired: true
                      origin: stripe
                      type: currency
                      defaultCurrency: USD
                    - id: status
                      labels:
                        singular: Order Status
                        plural: Order Statuses
                      description: Status of the order
                      isRequired: true
                      origin: stripe
                      type: dropdown
                      options:
                      - value: Processed
                    - id: features
                      labels:
                        singular: Order Feature
                        plural: Order Features
                      description: Extra features for the order
                      isRequired: true
                      origin: stripe
                      type: multiselect
                      options:
                      - value: Expedited Shipping
                    - id: rating
                      labels:
                        singular: Order Rating
                        plural: Order Ratings
                      description: Customer satisfaction rating
                      isRequired: true
                      origin: stripe
                      type: decimal
                      scale: 2
                    icons:
                      default: https://d226aj4ao1t61q.cloudfront.net/n9mayqo2d_customobject.png
                    relationships:
                    - id: primary-contact
                      labels:
                        singular: Primary Contact
                        plural: Primary Contacts
                      description: Products purchased in this Stripe order
                      namespace: contacts
                      hasMany: false
      responses:
        '200':
          description: '200'
          content:
            application/json:
