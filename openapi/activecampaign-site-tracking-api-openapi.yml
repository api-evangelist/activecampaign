      summary: ActiveCampaign Retrieve Site Tracking Code
      description: Get site tracking code
      operationId: retrieve-site-tracking-code
      responses:
        '200':
          description: '200'
          content:
            text/plain:
              examples:
                Result:
                  value: "<script type=\"text/javascript\">\n    (function(e,t,o,n,p,r,i){e.prismGlobalObjectAlias=n;e.pgo=e.pgo||function(){(e.pgo.q=e.pgo.q||[]).push(arguments)};e.pgo.l=(new Date).getTime();r=t.createElement(\"script\");r.src=o;r.async=true;i=t.getElementsByTagName(\"script\")[0];i.parentNode.insertBefore(r,i)})(window,document,\"https://prism.app-us1.com/prism.js\",\"pgo\");\n\n    pgo('setAccount', YOUR_ACCOUNT_ID);\n    pgo('setTrackByDefault', true);\n\n    pgo('process');\n</script>"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Site Tracking
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /siteTracking:
    get:
      summary: ActiveCampaign Retrieve Status
      description: Get site tracking status (enabled or disabled)
      operationId: retrieve-site-tracking-status
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"siteTracking\": {\n    \"enabled\": true\n  }\n}"
              schema:
                type: object
                properties:
                  siteTracking:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        example: true
                        default: true
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Site Tracking
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    put:
      summary: ActiveCampaign Enable/disable
      description: Enable or disable site tracking
      operationId: enable-disable-site-tracking
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                siteTracking:
                  properties:
                    enabled:
                      type: boolean
                      description: Whether site tracking should be enabled
                  required:
                  - enabled
                  type: object
            examples:
              Enable:
                value:
                  siteTracking:
                    enabled: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"siteTracking\": {\n    \"enabled\": true\n  }\n}"
              schema:
                type: object
                properties:
                  siteTracking:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        example: true
                        default: true
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: text
          code: "{\n  \"siteTracking\": {\n    \"enabled\": false\n  }\n}"
          name: Disable
        samples-languages:
