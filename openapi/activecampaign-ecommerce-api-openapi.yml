    delete:
      summary: ActiveCampaign Delete a Customer
      description: Delete an existing e-commerce customer resource.
      operationId: delete-customer
      parameters:
      - name: id
        in: path
        description: The id of the customer to delete.
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
