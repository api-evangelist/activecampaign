      operationId: delete-an-account
      parameters:
      - name: id
        in: path
        description: Account's id
        schema:
          type: integer
          format: int32
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
