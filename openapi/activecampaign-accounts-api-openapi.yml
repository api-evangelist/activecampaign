                          fieldCurrency:
                            type: string
                            description: Required only for the `currency` field type. The three letter currency code for the currency value
                        required:
                        - customFieldId
                        - fieldValue
                        type: object
                    owner:
                      type: integer
                      description: The userId of the Account owner.
                      default: 1
                      format: int32
                  required: []
                  type: object
            examples:
              Request Example:
                value:
                  account:
                    name: Exmaple Account
                    accountUrl: https://www.example.com
                    fields:
                    - customFieldId: 9
                      fieldValue: 500-1000
                    - customFieldId: 20
                      fieldValue: 1234
                      fieldCurrency: GBP
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"account\": {\n        \"name\": \"Exmaple Account\",\n        \"accountUrl\": \"https://www.example.com\",\n        \"createdTimestamp\": \"2019-04-03T13:57:31-05:00\",\n        \"updatedTimestamp\": \"2019-06-12T16:55:32-05:00\",\n        \"links\": [],\n        \"fields\": [\n            {\n                \"customFieldId\": 9,\n                \"fieldValue\": \"501 - 1000\",\n                \"accountId\": \"1\"\n            },\n            {\n                \"customFieldId\": 20,\n                \"fieldValue\": 1234,\n              \t\"fieldCurrency\": \"GBP\",\n                \"accountId\": \"1\"\n            }\n        ],\n        \"id\": \"1\"\n    }\n}"
              schema:
                type: object
                properties:
                  account:
                    type: object
                    properties:
                      name:
                        type: string
                        example: Exmaple Account
                      accountUrl:
                        type: string
                        example: https://www.example.com
                      createdTimestamp:
                        type: string
                        example: '2019-04-03T13:57:31-05:00'
                      updatedTimestamp:
                        type: string
                        example: '2019-06-12T16:55:32-05:00'
                      links:
                        type: array
                      fields:
                        type: array
                        items:
                          type: object
                          properties:
                            customFieldId:
                              type: integer
                              example: 9
                              default: 0
                            fieldValue:
                              type: string
                              example: 501 - 1000
                            accountId:
                              type: string
                              example: '1'
                      id:
                        type: string
                        example: '1'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Accounts
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    get:
      summary: ActiveCampaign Retrieve an Account
      description: Retrieve an existing account
      operationId: retrieve-an-account
      parameters:
      - name: id
        in: path
        description: Account's ID
        schema:
          type: integer
          format: int32
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"account\": {\n        \"name\": \"Example Account\",\n        \"accountUrl\": \"https://www.example.com\",\n        \"createdTimestamp\": \"2019-05-15T15:58:16-05:00\",\n        \"updatedTimestamp\": \"2019-05-15T15:58:16-05:00\",\n        \"links\": [],\n        \"id\": \"1\"\n    }\n}"
              schema:
                type: object
                properties:
                  account:
                    type: object
                    properties:
                      name:
                        type: string
                        example: Example Account
                      accountUrl:
                        type: string
                        example: https://www.example.com
                      createdTimestamp:
                        type: string
                        example: '2019-05-15T15:58:16-05:00'
                      updatedTimestamp:
                        type: string
                        example: '2019-05-15T15:58:16-05:00'
                      links:
                        type: array
                      id:
                        type: string
                        example: '1'
      deprecated: false
      tags:
      - Accounts
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    delete:
      summary: ActiveCampaign Delete an Account
