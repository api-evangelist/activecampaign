  /accountContacts:
    post:
      summary: ActiveCampaign Create an Association
      description: Create a new account association
      operationId: create-an-account-1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                accountContact:
                  properties:
                    account:
                      type: integer
                      description: Account ID
                      format: int32
                    contact:
                      type: integer
                      description: Contact ID
                      format: int32
                    jobTitle:
                      type: string
                      description: Job Title of the contact at the account
                  required:
                  - account
                  - contact
                  type: object
            examples:
              Request Example:
                value:
                  accountContact:
                    contact: 2
                    account: 1
                    jobTitle: Product Manager
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"accountContact\": {\n        \"account\": 2,\n        \"contact\": 1,\n        \"jobTitle\": \"Product Manager\",\n        \"createdTimestamp\": \"2019-06-26T10:49:10-05:00\",\n        \"updatedTimestamp\": \"2019-06-26T10:49:10-05:00\",\n        \"links\": {\n            \"account\": \"http://hosted.localdev/api/3/accountContacts/2/account\",\n            \"contact\": \"http://hosted.localdev/api/3/accountContacts/1/contact\"\n        },\n        \"id\": \"1\"\n    }\n}"
              schema:
                type: object
                properties:
                  accountContact:
                    type: object
                    properties:
                      account:
                        type: integer
                        example: 2
                        default: 0
                      contact:
                        type: integer
                        example: 1
                        default: 0
                      jobTitle:
                        type: string
                        example: Product Manager
                      createdTimestamp:
                        type: string
                        example: '2019-06-26T10:49:10-05:00'
                      updatedTimestamp:
                        type: string
                        example: '2019-06-26T10:49:10-05:00'
                      links:
                        type: object
                        properties:
                          account:
                            type: string
                            example: http://hosted.localdev/api/3/accountContacts/2/account
                          contact:
                            type: string
                            example: http://hosted.localdev/api/3/accountContacts/1/contact
                      id:
                        type: string
                        example: '1'
        '422':
          description: '422'
          content:
            application/json:
