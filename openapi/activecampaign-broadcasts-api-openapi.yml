openapi: 3.2.0
info:
  title: ActiveCampaign SMS Broadcast Broadcasts API
  description: API for managing SMS broadcasts, lists, metrics, and AI-powered content generation in ActiveCampaign
  version: 3.0.0
  contact:
    name: ActiveCampaign Support
    url: https://www.activecampaign.com
  x-generated-from: documentation
servers:
- url: https://{yourAccountName}.api-us1.com/api/3
  description: US-based Users
  variables:
    yourAccountName:
      default: yourAccountName
security:
- ApiToken: []
tags:
- name: Broadcasts
paths:
  /sms/broadcasts:
    get:
      tags:
      - Broadcasts
      summary: ActiveCampaign Get All Broadcast Messages
      description: Gets a paged list of all of a customer's broadcast messages with optional filtering
      operationId: listBroadcasts
      parameters:
      - name: offset
        in: query
        description: Offset for pagination
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: Number of items to return
        schema:
          type: integer
          default: 20
      - name: filters[name]
        in: query
        description: Filter by broadcast name
        schema:
          type: string
      - name: filters[status]
        in: query
        description: Filter by broadcast status
        schema:
          type: string
          enum:
          - draft
          - scheduled
          - sent
          - pending_review
          - sending
      - name: filters[type]
        in: query
        description: Filter by broadcast type (future feature)
        schema:
          type: string
      - name: orders[field]
        in: query
        description: Order results by field (ASC or DESC)
        schema:
          type: string
          enum:
          - ASC
          - DESC
      - name: start_date
        in: query
        description: Filter by start date (YYYY-MM-DD)
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        description: Filter by end date (YYYY-MM-DD)
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastListResponse'
        '403':
          description: Insufficient permissions
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    post:
      tags:
      - Broadcasts
      summary: ActiveCampaign Create a New Broadcast Message
      description: Creates a new SMS broadcast message
      operationId: createBroadcast
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BroadcastCreateRequest'
      responses:
        '201':
          description: Broadcast created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastMessage'
        '400':
          description: Invalid request data
        '403':
          description: Insufficient permissions
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /sms/broadcasts/{id}:
    get:
      tags:
      - Broadcasts
      summary: ActiveCampaign Get Broadcast Message
      description: Retrieves the full details for one broadcast message
      operationId: getBroadcast
      parameters:
      - name: id
        in: path
        required: true
        description: Broadcast ID
        schema:
          type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastMessage'
        '403':
          description: Insufficient permissions
        '404':
          description: Broadcast not found
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    put:
      tags:
      - Broadcasts
      summary: ActiveCampaign Update Broadcast Message
      description: Updates an existing broadcast message
      operationId: updateBroadcast
      parameters:
      - name: id
        in: path
        required: true
        description: Broadcast ID
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BroadcastUpdateRequest'
      responses:
        '200':
          description: Broadcast updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastMessage'
        '403':
          description: Insufficient permissions
        '404':
          description: Broadcast not found
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    delete:
      tags:
      - Broadcasts
      summary: ActiveCampaign Delete Broadcast Message
      description: Performs a soft-delete on the requested message
      operationId: deleteBroadcast
      parameters:
      - name: id
        in: path
        required: true
        description: Broadcast ID
        schema:
          type: integer
      responses:
        '200':
          description: Broadcast deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastMessage'
        '403':
          description: Insufficient permissions
        '404':
          description: Broadcast not found
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /sms/lists:
    get:
      tags:
      - Broadcasts
      summary: ActiveCampaign Get All Broadcast Lists
      description: Gets a paged list of all broadcast lists (SMS channel)
      operationId: listBroadcastLists
      parameters:
      - name: offset
        in: query
        description: Offset for pagination
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: Number of items to return
        schema:
          type: integer
          default: 20
      - name: filters[name]
        in: query
        description: Filter by list name
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastListsResponse'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    BroadcastListsResponse:
      type: object
      properties:
        lists:
          type: array
          items:
            $ref: '#/components/schemas/BroadcastList'
        meta:
          type: object
          properties:
            total:
              type: integer
    BroadcastCreateRequest:
      type: object
      required:
      - name
      - body
      properties:
        name:
          type: string
          description: Name of the broadcast
        address_id:
          type:
          - integer
          - 'null'
          description: ID for sender name
        body:
          type: string
          description: SMS message content
        media_urls:
          type: array
          items:
            type: string
            format: uri
          description: Media URLs for MMS
        preview_url:
          type: string
          format: uri
        shorten_track_links_enabled:
          type: boolean
        status:
          type: string
          enum:
          - draft
        scheduled_date:
          type: string
          format: date-time
        sent_to_count:
          type: integer
        list_ids:
          type: array
          items:
            type: integer
        segment_id:
          type: string
        custom_segment_id:
          type:
          - string
          - 'null'
          description: custom segment id generated from segmentsV2 endpoint and passing in a valid audience
          format: uuid
        label_ids:
          type: array
          items:
            type: integer
    BroadcastListResponse:
      type: object
      properties:
        broadcasts:
          type: array
          items:
            $ref: '#/components/schemas/BroadcastMessage'
        meta:
          type: object
          properties:
            total:
              type: integer
              description: Total number of broadcasts
    BroadcastUpdateRequest:
      type: object
      properties:
        name:
          type: string
        address_id:
          type:
          - integer
          - 'null'
        body:
          type: string
        media_urls:
          type: array
          items:
            type: string
            format: uri
        preview_url:
          type: string
          format: uri
        shorten_track_links_enabled:
          type: boolean
        status:
          type: string
          description: Status of the broadcast. pending_review starts kicks off the broadcast to be sent
          enum:
          - draft
          - pending_review
        scheduled_date:
          type: string
          format: date-time
        sent_to_count:
          type: integer
        list_ids:
          type: array
          items:
            type: integer
        segment_id:
          type: string
        custom_run_id:
          type:
          - string
          - 'null'
          description: custom run id generated from segmentMatchSome endpoint and passing a valid segment id
          format: uuid
        custom_segment_id:
          type:
          - string
          - 'null'
          description: custom segment id generated from segmentsV2 endpoint and passing in a valid audience
          format: uuid
        label_ids:
          type: array
          items:
            type: integer
    BroadcastList:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        subscriber_count:
          type: integer
    BroadcastMessage:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the broadcast
        name:
          type: string
          description: Name of the broadcast
        address_id:
          type:
          - integer
          - 'null'
          description: ID used to get sender name
        body:
          type: string
          description: SMS message content
        media_urls:
          type: array
          items:
            type: string
            format: uri
          description: Media URLs for MMS messages
        preview_url:
          type: string
          format: uri
          description: URL for message preview
        shorten_track_links_enabled:
          type: boolean
          description: Whether link shortening is enabled
        status:
          type: string
          enum:
          - draft
          - scheduled
          - sent
          - pending_review
          - sending
          description: Current status of the broadcast
        sent_date:
          type:
          - string
          - 'null'
          format: date-time
          description: Date when broadcast was sent
        scheduled_date:
          type:
          - string
          - 'null'
          format: date-time
          description: Scheduled send date (UTC)
        custom_run_id:
          type:
          - string
          - 'null'
          format: uuid
          description: custom run id generated from segmentMatchSome endpoint
        custom_segment_id:
          type:
          - string
          - 'null'
          format: uuid
          description: custom segment id generated from segmentsV2 endpoint and passing in a valid audience
        scheduled_by:
          type:
          - integer
          - 'null'
          description: User ID who scheduled the broadcast
        sent_to_count:
          type:
          - integer
          - 'null'
          description: Number of recipients
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        created_by:
          type: integer
          description: User ID who created the broadcast
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
        updated_by:
          type: integer
          description: User ID who last updated
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Deletion timestamp (for soft deletes)
        sift_approved:
          type: integer
          description: Sift approval status
        arc_approved:
          type: integer
          description: ARC approval status
        quiet_hours_enabled:
          type:
          - integer
          - 'null'
          description: Whether quiet hours are enabled
        list_ids:
          type: array
          items:
            type: integer
          description: Associated list IDs
        segment_id:
          type:
          - string
          - 'null'
          description: Segment ID (can be UUID or integer string)
        label_ids:
          type:
          - array
          - 'null'
          items:
            type: integer
          description: Associated label IDs
  securitySchemes:
    ApiToken:
      type: apiKey
      name: Api-Token
      in: header
      description: Your ActiveCampaign API token
