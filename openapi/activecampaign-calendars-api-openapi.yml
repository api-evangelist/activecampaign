                              example: https://:account.api-us1.com/api/:version/calendars/2/calendarRels
                            calendarUsers:
                              type: string
                              example: https://:account.api-us1.com/api/:version/calendars/2/calendarUsers
                        id:
                          type: string
                          example: '2'
                  meta:
                    type: object
                    properties:
                      total:
                        type: string
                        example: '1'
      deprecated: false
      tags:
      - Calendars
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
