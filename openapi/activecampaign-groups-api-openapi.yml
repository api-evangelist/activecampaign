                        example: 87
                        default: 0
                      group_id:
                        type: integer
                        example: 1
                        default: 0
                      rel_id:
                        type: integer
                        example: 10
                        default: 0
                      ordernum:
                        type: integer
                        example: 18
                        default: 0
                      created_by:
                        type: integer
                        example: 1
                        default: 0
                      updated_by:
                        type: integer
                        example: 1
                        default: 0
                      links:
                        type: object
                        properties:
