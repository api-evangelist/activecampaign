      description: ''
      operationId: add-custom-field-to-field-group
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                groupMember:
                  properties:
                    rel_id:
                      type: integer
                      description: Custom field ID
                      format: int32
                    ordernum:
                      type: integer
                      description: Order within the field group, use null to append
                      format: int32
                    group_id:
                      type: integer
                      default: null
                      format: int32
                  required: []
                  type: object
            examples:
              POST:
                value:
                  groupMember:
                    rel_id: '10'
                    ordernum: null
                    group_id: '1'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"groupMember\": {\n        \"id\": 87,\n        \"group_id\": 1,\n        \"rel_id\": 10,\n        \"ordernum\": 18,\n        \"created_by\": 1,\n        \"updated_by\": 1,\n        \"links\": {\n            \"groupDefinition\": \"https://yourAccounut.api-us1.com/api/3/groupDefinitions/1\"\n        }\n    }\n}"
