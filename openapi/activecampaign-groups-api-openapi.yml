                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                          default: 0
                        type_id:
                          type: integer
                          example: 1
                          default: 0
                        label:
                          type: string
                          example: '{**DEFAULT**}'
                        ordernum:
                          type: integer
                          example: 1
                          default: 0
                        links:
                          type: object
                          properties:
                            groupMembers:
