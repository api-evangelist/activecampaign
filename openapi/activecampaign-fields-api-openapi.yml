                type: object
                properties:
                  field:
                    type: object
                    properties:
                      title:
                        type: string
                        example: Title
                      descript:
                        type: string
                        example: Field  description
                      type:
                        type: string
                        example: textarea
                      isrequired:
                        type: integer
                        example: 0
                        default: 0
                      perstag:
                        type: string
                        example: PERSONALIZEDTAG
                      defval:
                        type: string
                        example: Defaut Value
                      show_in_list:
                        type: integer
                        example: 1
                        default: 0
                      rows:
                        type: integer
                        example: 2
                        default: 0
                      cols:
                        type: integer
                        example: 2
                        default: 0
                      visible:
                        type: integer
                        example: 1
                        default: 0
                      service:
                        type: string
                        example: google
                      ordernum:
                        type: integer
                        example: 3
                        default: 0
                      cdate:
                        type: string
                        example: '2018-09-25T16:06:08-05:00'
                      udate:
                        type: string
                        example: '2018-09-29T18:23:20-05:00'
                      links:
                        type: object
                        properties:
                          options:
                            type: string
                            example: https://:account.api-us1.com/api/:version/fields/3/options
                          relations:
                            type: string
                            example: https://:account.api-us1.com/api/:version/fields/3/relations
                      id:
                        type: string
                        example: '3'
        '403':
          description: '403'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"message\": \"Forbidden\"\n}"
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Forbidden
