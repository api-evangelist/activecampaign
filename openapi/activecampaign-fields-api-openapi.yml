                        example: '2018-08-17T11:09:43-05:00'
                      udate:
                        type: string
                        example: '2018-08-17T11:09:43-05:00'
                      options:
                        type: array
                      relations:
                        type: array
                        items:
                          type: string
                          example: '1'
                      links:
                        type: object
                        properties:
                          options:
                            type: string
                            example: https://:account.api-us1.com/api/3/fields/1/options
                          relations:
                            type: string
