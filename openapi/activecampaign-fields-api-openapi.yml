  /fieldRels:
    post:
      summary: ActiveCampaign Create a Custom Field Relationship to List(s)
      description: ''
      operationId: create-a-custom-field-relationship-to-lists
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fieldRel:
                  type: object
                  properties:
                    field:
                      type: integer
                      description: ID of the field to create the relationship
                      default: 8
                      format: int32
                    relid:
                      type: integer
                      description: ID of the list to create the relationship (0 makes the field available on all lists)
                      default: 2
                      format: int32
            examples:
              Request Example:
                value:
                  fieldRel:
                    field: 8
                    relid: 2
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"fieldRel\": {\n        \"relid\": 2,\n        \"field\": 8,\n        \"cdate\": \"2019-02-01T08:39:25-06:00\",\n        \"links\": [],\n        \"id\": \"19\"\n    }\n}"
              schema:
                type: object
                properties:
                  fieldRel:
                    type: object
                    properties:
                      relid:
                        type: integer
                        example: 2
                        default: 0
                      field:
                        type: integer
                        example: 8
                        default: 0
                      cdate:
                        type: string
                        example: '2019-02-01T08:39:25-06:00'
                      links:
                        type: array
                      id:
                        type: string
                        example: '19'
        '403':
          description: '403'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"message\": \"Forbidden\"\n}"
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Forbidden
