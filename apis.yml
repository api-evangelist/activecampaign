position: Consumer
description: 'ActiveCampaign is a marketing automation and customer experience platform used by more than 180,000
  businesses for email marketing, marketing automation, CRM and sales automation. Its developer surface is unusually
  broad: nine published OpenAPI documents discoverable through a real RFC 9727 /.well-known/api-catalog, covering
  the v3 REST API, SMS Broadcast, WhatsApp messaging, Segments V2 and asynchronous segment matching, a reseller
  Partners API, trackcmp event ingest and a surviving v2 operation. It also ships an Ecommerce GraphQL API, an outbound
  webhook surface, a first-party remote MCP server with a published tool index, an A2A agent card, and an MIT-licensed
  Claude plugin of first-party Agent Skills. Authentication is a single unscoped Api-Token header; the base URL
  is per account.'
