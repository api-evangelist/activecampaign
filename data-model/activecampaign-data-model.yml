composite_notes:
  - >-
    Ecommerce data is stored as ActiveCampaign Custom Objects under the hood.
    ActiveCampaign says so directly: the Ecommerce GraphQL API "saves order, product,
    and recurring payment data as ActiveCampaign Custom Objects", whose schemas
    ActiveCampaign manages and does not bill for. So EcomOrder/EcomCustomer and
    CustomObjectRecord are two projections of one store, which is why order data is
    usable in segmentation and product data is not.
  - >-
    Segment matching is a job, not a query. create_match_all_request returns within
    ~4 seconds or hands back a runId with is_ready false; the result set is cached
    against that runId with a 24-hour TTL, and changing the sort order on a poll
    invalidates the cache and restarts the search.
