description: >-
  Entity-relationship graph for the ActiveCampaign platform, derived from the published
  REST contract. ActiveCampaign's data model has one root — Contact — and everything
  else either describes a contact, groups contacts, sends to contacts, or records what
  a contact did. The relationships below are read from real paths and real id-reference
  fields; nothing is inferred from naming alone.
id_convention:
  style: opaque-numeric-string
  note: >-
    ActiveCampaign ids are integers serialized as JSON strings in most responses
    ("id": "12"). There are no typed id prefixes (no cus_/deal_ style), so an id
    carries no type information and an agent must track which collection an id came
    from. SegmentsV2 is the exception: it accepts non-numeric segment ids, and
    ActiveCampaign notes that historic-definition and revert operations work ONLY on
    non-numeric segment ids.
  external_id_support:
    - {entity: CustomObjectRecord, field: externalId, note: 'Delete-by-external-id is published: DELETE /customObjects/records/{schemaId}/external/{externalId}.'}
    - {entity: Segment, field: externalId, note: 'segment_match_check_by_external_id matches a contact to a segment by external id.'}
    - {entity: Contact, field: email, note: 'POST /contact/sync treats email as the natural key — the closest thing to an external id on the core entity.'}
