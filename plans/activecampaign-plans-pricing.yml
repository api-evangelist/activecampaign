specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: ActiveCampaign
providerId: activecampaign
created: '2026-05-04'
modified: '2026-08-13'
generated: '2026-08-13'
method: searched
source: https://www.activecampaign.com/pricing
docs: https://www.activecampaign.com/pricing
tags:
  - Marketing Automation
  - Email Marketing
  - CRM
  - Sales Automation
  - Customer Experience
description: >-
  ActiveCampaign's four published plan tiers, read from its own pricing page. This
  replaces the 2026-05-04 scaffold, which invented an "activecampaign-free" tier with a
  1,000 request/month API quota — ActiveCampaign has no free tier and meters nothing in
  API requests. Its real billing dimension is CONTACTS: you choose a contact volume and
  every quota on the plan is expressed as a multiple of that number. API access is
  included on every paid tier and is not itself a priced line item.
billing_model:
  primary_metric: contacts
  secondary_metric: users
  note: >-
    Price is a function of the contact count chosen on the pricing slider, so a single
    numeric price per tier does not exist. Email send allowances are stated as
    multiples of the contact limit rather than as absolute numbers.
  api_metered: false
  api_note: >-
    The v3 REST API, the Ecommerce GraphQL API and the remote MCP server are included
    with the platform subscription. No plan prices API calls, and no plan differentiates
    the rate limit — every tier is documented at the same 5 requests/second/account.
  free_tier: false
  trial:
    available: true
    length_days: 14
    credit_card_required: false
    source: https://www.activecampaign.com/pricing
plan_count: 4
plans:
  - id: activecampaign-starter
    name: Starter
    type: paid
    order: 1
    description: Get started with personalized email marketing campaigns.
    price: null
    currency: USD
    price_note: >-
      Published as "Starts at —" and rendered client-side from the contact-count
      slider; no static price is present in the page source. Recorded as null rather
      than guessed.
    billing_period: [monthly, annual]
    billing_note: The displayed rate is the annually-billed rate; monthly billing is offered at a higher rate.
    entries:
      - {label: Users, name: users, type: quota, metric: users, limit: 1}
      - {label: Email sends, name: email_sends, type: quota, metric: multiple_of_contact_limit, limit: 10, unit: x contact limit}
      - {label: Automation actions, name: automation_actions, type: quota, metric: actions_per_automation, limit: 5}
      - {label: Active business goals, name: business_goals, type: quota, metric: active_goals, limit: 15}
      - {label: AI brand kits, name: ai_brand_kits, type: quota, metric: brand_kits, limit: 1}
      - {label: Segmentation, name: segmentation, type: feature, value: Limited}
      - {label: Active Intelligence, name: active_intelligence, type: feature, value: Limited access}
