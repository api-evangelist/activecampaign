  edge_evidence: https://zapier.com/apps/activecampaign/integrations/facebook-lead-ads/10148/add-or-update-activecampaign-contacts-with-new-facebook-lead-ads-leads
  edge_type: marketplace
  method: generated
  generated: '2026-10-12'
  generator: claude-opus-5.5 enrichment local-v5
  guessed_steps:
  - step: list-leads
    cause: partner-contract
    why: data[] items are untyped in the spec; the field_data position of the email answer is the Graph API convention, not settled by the contract
  - step: sync-contact
    cause: provider-contract
    why: the sync-a-contacts-data 201 response schema lists contact fields but no contact.id, so the output path /contact/id is not settled by the spec
