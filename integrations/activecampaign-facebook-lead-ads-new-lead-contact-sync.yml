arazzo: 1.0.1
info:
  title: ActiveCampaign Facebook Lead Ads new lead contact sync
  summary: Add or update ActiveCampaign contacts with new Facebook Lead Ads leads
  description: Add or update ActiveCampaign contacts with new Facebook Lead Ads leads. Reads the record from Facebook Lead Ads, creates or updates the contact in ActiveCampaign with contact sync, then subscribes
    it to a list. Recreated from the Zapier template linked in x-integration.
  version: 1.0.0
sourceDescriptions:
- name: facebookLeads
  url: https://raw.githubusercontent.com/api-evangelist/facebook-lead-ads/refs/heads/main/openapi/facebook-lead-ads-leads-api-openapi.yml
  type: openapi
- name: activecampaignContacts
  url: https://raw.githubusercontent.com/api-evangelist/activecampaign/refs/heads/main/openapi/activecampaign-contacts-api-openapi.yml
  type: openapi
workflows:
- workflowId: facebook-lead-ads-new-lead-contact-sync
  summary: Add or update ActiveCampaign contacts with new Facebook Lead Ads leads
  description: Add or update ActiveCampaign contacts with new Facebook Lead Ads leads.
  inputs:
    type: object
    properties:
      formId:
        type: string
      listId:
        type: string
        description: ActiveCampaign list to subscribe the contact to
  steps:
  - stepId: list-leads
    description: Read the new Facebook Lead Ads record.
    operationId: $sourceDescriptions.facebookLeads.listLeadsForForm
    parameters:
    - name: form-id
      in: path
      value: $inputs.formId
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      email: $response.body#/data/0/field_data/0/values/0
  - stepId: sync-contact
    description: Create or update the ActiveCampaign contact by email.
    operationId: $sourceDescriptions.activecampaignContacts.sync-a-contacts-data
    requestBody:
      contentType: application/json
      payload:
        contact:
          email: $steps.list-leads.outputs.email
    successCriteria:
    - condition: $statusCode == 201
    outputs:
      contactId: $response.body#/contact/id
  - stepId: subscribe-to-list
    description: Subscribe the synced contact to the list.
    operationId: $sourceDescriptions.activecampaignContacts.update-list-status-for-contact
    requestBody:
      contentType: application/json
      payload:
        contactList:
          list: $inputs.listId
          contact: $steps.sync-contact.outputs.contactId
          status: '1'
    successCriteria:
    - condition: $statusCode == 200
  outputs:
    contactId: $steps.sync-contact.outputs.contactId
x-integration:
