summary:
  total: 5
  official: 3
  official_api_clients: 2
  languages: [php, javascript, ruby, python]
  registries: [packagist, npm, rubygems]
  finding: >-
    Both first-party API clients are abandoned. The newest release of either is
    2018-03-13 (npm `activecampaign` 1.2.5); the PHP client last shipped 2017-04-26.
    ActiveCampaign has since published five additional OpenAPI documents and a
    50-tool MCP server, none of which any first-party SDK covers. A developer
    following the provider's own SDK page today installs a library seven or more
    years older than the API it is meant to call.
