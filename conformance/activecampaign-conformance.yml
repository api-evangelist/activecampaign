      account-gated. It is not a projection of the whole platform.
  - id: asyncapi
    conforms: false
    evidence: >-
      ActiveCampaign publishes no AsyncAPI document. Its webhook surface is real and
      documented in prose; asyncapi/activecampaign-webhooks-asyncapi.yml in this repo
