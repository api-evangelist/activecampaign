  Nothing in this directory is authored by API Evangelist — where a provider ships real
  skills, the pipeline captures them rather than generating substitutes.
publisher:
  name: ActiveCampaign, LLC
  repository: https://github.com/ActiveCampaign/activecampaign-plugin
  license: MIT
  plugin_name: activecampaign
  plugin_version: 0.2.0
  contact: amurrey@activecampaign.com
  manifest: skills/activecampaign-plugin/activecampaign-plugin.json
grounding:
  surface: mcp
  server: mcp/activecampaign-mcp.yml
  note: >-
    Every skill is grounded in MCP tool names (mcp__activecampaign__*), not in REST
    operationIds. The REST operations behind each tool are resolved in
    mcp/activecampaign-tool-crosswalk.yml, so a reader can follow a skill step all the
    way down to a v3 operation and its real parameters.
safety_contract:
  pattern: read -> preview -> confirm -> execute -> verify
  note: >-
    ActiveCampaign's own design decision, and a sensible one given the API has no
    idempotency key and no undo. The plugin pre-approves each skill's READ tools in
    allowed-tools and deliberately leaves WRITE tools to the host's permission prompt.
