generated: '2026-08-13'
method: searched
status: published
source: https://developers.activecampaign.com/page/mcp
description: >-
  ActiveCampaign ships a first-party remote MCP server. The tool roster below is the
  provider's own published table at
  https://developers.activecampaign.com/page/mcp-available-tools/ (page updatedAt
  2026-07-13), captured verbatim — tool names and descriptions are ActiveCampaign's,
  not ours. Input schemas are NOT included because the live tools/list call cannot be
  made anonymously: the server URL is issued per account.
deployment:
  mode: remote
  endpoint: null
  endpoint_template: 'https://{yoursubdomain}.activehosted.com/api/agents/mcp/http'
  endpoint_note: >-
    `endpoint` is deliberately null: ActiveCampaign issues a DIFFERENT Remote MCP URL to
    every account and publishes no shared hostname, so there is no single URL an agent
    can be pointed at. `endpoint_template` is NOT a guess — it is the pattern
    ActiveCampaign itself publishes in .claude-plugin/plugin.json of its own
    activecampaign-plugin repo: "Find this in your AC account under Settings >
    Developer > MCP. It looks like: https://yoursubdomain.activehosted.com/api/agents/
    mcp/http". Note the host is activehosted.com (the app domain), not api-us1.com (the
    REST domain) — the MCP server and the REST API live on different hosts. The
    plugin's .mcp.json wires the server as {"type":"url","url":"${user_config.
    server_url}"}, i.e. a user-supplied value.
  install: null
  package: null
  auth: api-key
  auth_note: >-
    The provider-published agent card declares authType "api-key-in-url" — the
    account API key is embedded in the per-account MCP URL. There is no OAuth
    authorization server (/.well-known/oauth-authorization-server 404s on every host).
  verified: searched
