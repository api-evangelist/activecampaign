docs_vs_server_divergence:
  documented_tools: 50
  live_tools_claimed: 60
  detail: >-
    ActiveCampaign's own plugin CHANGELOG (0.2.0) says the README was "rewritten to
    match the real server (60 tools)" — ten more than the 50 rows on the published
    Available Tools page. At least one of the missing ten is nameable: the plugin's
    0.2.0 "Fixed" entry corrects `list_stages` to the real tool `list_deal_stages`,
    which appears in the reporting-analyst skill's allowed-tools list and does NOT
    appear on the docs page. So the published tool index is stale relative to the
    server ActiveCampaign is shipping against.
  agent_impact: >-
    An agent that plans from the documentation will under-use the server, and a
    crosswalk built from the docs (ours included) is a floor, not a census. Only an
    authenticated tools/list can settle the real roster.
  evidence:
    - {url: 'https://raw.githubusercontent.com/ActiveCampaign/activecampaign-plugin/main/CHANGELOG.md', via: 'GitHub contents API', fetched: '2026-08-13'}
    - {file: 'skills/activecampaign-plugin/activecampaign-reporting-analyst.md', field: 'allowed-tools', tool: 'mcp__activecampaign__list_deal_stages'}
limitations:
  - >-
    tools/list could not be called: with no anonymous endpoint there is nothing to POST
    to, so the real per-tool inputSchema is unavailable. The crosswalk in
    mcp/activecampaign-tool-crosswalk.yml binds each tool to a backing v3 operationId
    instead, which is where the real input contract lives.
  - >-
    The tool table is a rendered HTML page, not a machine-readable manifest. It was
    parsed, not guessed; the counts above are the rows the provider published.
  - >-
    The published roster is incomplete — see docs_vs_server_divergence above.
  - >-
    The server enforces a no-aggregates rule the tool table does not mention:
    ActiveCampaign's own plugin changelog records that reports were rewritten to
    "comply with the server's no-aggregate rules" and must present per-record counts
    and top-N lists instead of computing win rate, completion rate, averages, totals or
    conversion. An agent asking this server for a rate will not get one.
