finding: 'The MCP surface is a deliberate 50-tool subset of a 367-operation REST surface -- roughly 15%.
  The agent surface covers contacts, tags, lists, custom fields and field values, campaigns, automations,
  deals, pipelines, activities, groups and custom objects, and covers nothing else: ecommerce/deep data,
  WhatsApp, SMS broadcasts, forms, site and event tracking, accounts, users, reseller/partner management,
  AI customization profiles, segments and webhooks have no tool. Notably the MCP server can read and update
  campaign message content but cannot send a campaign.'
