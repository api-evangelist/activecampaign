source: mcp/activecampaign-mcp.yml + openapi/*.yml + openapi/*.json
description: Binds every tool ActiveCampaign publishes on its remote MCP server to the v3 REST operation(s)
  that back it, so each tool inherits a real input contract (the operation's parameters and requestBody)
  instead of a guessed one. The live tools/list manifest is unreachable anonymously -- ActiveCampaign
  issues a per-account MCP URL -- so bindings are by name and published description, with confidence recorded
  honestly per row.
